schema_version = "1.0.0"

id = "eachlabs"
version = "0.2.0"
name = "Eachlabs"
tagline = "Generate images and videos from your renders with Eachlabs"
maintainer = "Eachlabs"
type = "add-on"
website = "https://www.eachlabs.ai"

tags = ["Render", "Sequencer"]

blender_version_min = "4.2.0"

# Skia draws the chat bar. scripts/build.sh downloads these wheels before building.
platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]
wheels = [
    "./wheels/skia_python-144.1-cp311-cp311-macosx_11_0_arm64.whl",
    "./wheels/skia_python-144.1-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/skia_python-144.1-cp311-cp311-macosx_11_0_x86_64.whl",
    "./wheels/skia_python-144.1-cp313-cp313-macosx_11_0_x86_64.whl",
    "./wheels/skia_python-144.1-cp311-cp311-win_amd64.whl",
    "./wheels/skia_python-144.1-cp313-cp313-win_amd64.whl",
    "./wheels/skia_python-144.1-cp311-cp311-manylinux_2_28_x86_64.whl",
    "./wheels/skia_python-144.1-cp313-cp313-manylinux_2_28_x86_64.whl",
]

# Bundled: Inter and Geist Mono fonts (SIL OFL 1.1), Skia in the skia-python wheels (BSD-3-Clause).
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Eachlabs"]

[permissions]
network = "Send renders and prompts to Eachlabs and download results"
files = "Write renders and generated results next to the .blend file"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*", "README.md"]  # package READMEs are for the repository
